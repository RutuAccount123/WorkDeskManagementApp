# Push to main: first the tests run. Only when ALL of them pass does the code go to production.
#  - Vercel (frontend): deployed by the last job below, through the Deploy Hook.
#  - Render (backend): Render waits for these checks itself (Auto-Deploy = "After CI Checks Pass").
# GitHub secret needed: VERCEL_DEPLOY_HOOK (Vercel → project → Settings → Git → Deploy Hooks).
name: CI-CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-cd-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend tests + build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: workdesk-frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: workdesk-frontend/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build

  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: workdesk-backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - run: mvn -B verify

  deploy-frontend:
    name: Deploy frontend (Vercel)
    needs: [frontend, backend]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Vercel production deploy
        env:
          HOOK: ${{ secrets.VERCEL_DEPLOY_HOOK }}
        run: |
          if [ -z "$HOOK" ]; then
            echo "::error::GitHub secret VERCEL_DEPLOY_HOOK is missing (repo Settings > Secrets and variables > Actions)."
            exit 1
          fi
          curl -fsS -X POST "$HOOK"
