# Push to main: first the tests run. Only when ALL of them pass does the code go to production.
#  - Vercel (frontend): deployed through the Deploy Hook.
#  - Hostinger VPS (backend): deployed over SSH (runs /opt/ewms/deploy.sh on the VPS).
# GitHub secrets needed: VERCEL_DEPLOY_HOOK, VPS_HOST, VPS_USER, VPS_SSH_KEY
name: CI-CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-cd-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend tests + build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: workdesk-frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: workdesk-frontend/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build

  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: workdesk-backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - run: mvn -B verify

  deploy-frontend:
    name: Deploy frontend (Vercel)
    needs: [frontend, backend]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Vercel production deploy
        env:
          HOOK: ${{ secrets.VERCEL_DEPLOY_HOOK }}
        run: |
          if [ -z "$HOOK" ]; then
            echo "::error::GitHub secret VERCEL_DEPLOY_HOOK is missing (repo Settings > Secrets and variables > Actions)."
            exit 1
          fi
          curl -fsS -X POST "$HOOK"

  deploy-backend:
    name: Deploy backend (Hostinger VPS)
    needs: [frontend, backend]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Deploy on VPS
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          command_timeout: 15m
          script: bash /opt/ewms/deploy.sh
